<div class="card ms-card p-4 mt-3" id="locCard">
  <h2 class="ms-section-title mb-2">📍 YOUR LOCATION</h2>
  <p class="small text-muted">Your location is read only in your browser to open a map. MedSecure AI does not store it.</p>
  <button type="button" id="findPharmacyBtn" class="btn btn-ms"><i class="bi bi-geo-alt"></i> Find Nearby Pharmacy</button>
  <div id="locMsg" class="ms-status ms-status-bad mt-3 mb-0 d-none"><i class="bi bi-exclamation-circle"></i><div><p></p></div></div>
  <div id="locResult" class="d-none mt-3">
    <iframe id="osmMap" class="ms-map" title="Your location" loading="lazy"></iframe>
    <a id="mapsLink" class="btn btn-outline-success mt-2" target="_blank" rel="noopener"><i class="bi bi-shop"></i> Show pharmacies near me (Google Maps)</a>
  </div>
  <div class="small mt-3"><a href="https://www.google.com/maps/search/pharmacy+near+me" target="_blank" rel="noopener">Search pharmacies without sharing location</a></div>
</div>
