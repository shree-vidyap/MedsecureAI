<div class="ms-mascot-wrap">
  <div class="ms-bubble" aria-live="polite">
    <span id="msBubbleText" data-name="{{ mascot_name|default('') }}" data-msgs='{{ mascot_msgs|default([])|tojson }}'></span>
    <button type="button" id="msVoiceBtn" class="ms-voice" title="Tap to hear me" aria-label="Voice"><i class="bi bi-volume-mute"></i></button>
  </div>
  <svg id="msMascot" class="ms-mascot" viewBox="0 0 120 120" aria-hidden="true">
    <line x1="60" y1="8" x2="60" y2="22" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="8" r="5" fill="#f59e0b" class="ms-eye"/>
    <rect x="24" y="22" width="72" height="56" rx="20" fill="#e6fffa" stroke="#0d9488" stroke-width="3"/>
    <rect x="34" y="34" width="52" height="30" rx="13" fill="#0f172a"/>
    <circle cx="49" cy="46" r="5" fill="#2dd4bf" class="ms-eye"/><circle cx="71" cy="46" r="5" fill="#2dd4bf" class="ms-eye"/>
    <rect id="msMouth" x="52" y="55" width="16" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="38" y="84" width="44" height="26" rx="12" fill="#0d9488"/>
    <rect x="52" y="90" width="16" height="6" rx="3" fill="#fff"/><rect x="57" y="85" width="6" height="16" rx="3" fill="#fff"/>
    <g transform="rotate(-35 100 88)"><rect x="90" y="80" width="20" height="10" rx="5" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <rect x="100" y="80" width="10" height="10" rx="5" fill="#f43f5e"/></g>
  </svg>
</div>
