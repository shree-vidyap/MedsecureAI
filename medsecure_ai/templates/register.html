{% extends "base.html" %}
{% block title %}Register - MedSecure AI{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5">
  <div class="card ms-card p-4 p-md-5">
    <a href="{{ url_for('main.home') }}" class="ms-back small"><i class="bi bi-arrow-left"></i> Back</a>
    <div class="text-center mb-4">
      <div class="ms-logo"><i class="bi bi-shield-plus"></i></div>
      <h1 class="ms-title h3">Create Account</h1>
    </div>
    {% include "partials/flash.html" %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password <small class="text-muted">(min 8 characters)</small></label>
        <input type="password" name="password" class="form-control" required></div>
      <div class="mb-4"><label class="form-label">Confirm Password</label>
        <input type="password" name="confirm" class="form-control" required></div>
      <button class="btn btn-ms w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0 small">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</div></div></div>
{% endblock %}
